providers:
  openai:
    provider: openai
    api_key_env: OPENAI_API_KEY
    model: gpt-5-mini
    research_label: GPT Study-style tutor
    actual_api_mode: standard Responses API with shared tutoring prompt
  anthropic:
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5-20251001
    research_label: Claude Tutor-style tutor
    actual_api_mode: standard Messages API with shared tutoring prompt
  gemini:
    provider: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
    research_label: Gemini Learner-style tutor
    actual_api_mode: standard Gemini API with shared tutoring prompt
